name: release

on:
  push:
    tags: ['v*']
  # Re-land an existing release in the Homebrew tap without cutting a new one — the
  # release job is skipped and the formula is rendered from the published SHA256SUMS.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to the tap, e.g. v1.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    # macOS, so the Mac bundle can be built and its two architectures joined with lipo.
    # Everything else cross-compiles from here with cgo off, so one job produces the whole
    # release rather than two that have to agree with each other.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The gate runs against the thing being released, not against main.
      - run: make check

      - run: make dist VERSION=${GITHUB_REF_NAME}
      - run: make app-dist VERSION=${GITHUB_REF_NAME}

      # The checksums are regenerated after the bundle exists, so the file people are
      # most likely to download is the one most likely to be covered.
      - name: checksum everything that ships
        run: |
          # The installer is downloaded from the tag, so it ships with it and is covered
          # by the same checksums as the binaries it fetches.
          cp install.sh dist/
          cd dist
          rm -f SHA256SUMS
          shasum -a 256 ferrule-* Ferrule-macos.zip install.sh > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ferrule-*
            dist/Ferrule-macos.zip
            dist/install.sh
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            **macOS (Apple Silicon)** — `Ferrule-macos.zip`. Unzip, drag `Ferrule.app`
            to Applications, double-click. Not notarised, so the first open needs
            right-click → Open. On an Intel Mac use `ferrule-darwin-amd64`.

            **Linux / Windows** — download the binary for your machine, make it
            executable, run `ferrule serve`, open <http://localhost:8899>.

            **Go** — `go install github.com/NakliTechie/ferrule/cmd/ferrule@${{ github.ref_name }}`

            Verify what you downloaded against `SHA256SUMS`.

  # The formula and cask are rendered from the release that now exists, so they can only
  # name assets that are really there, and committed by the tap's own workflow — the
  # one place that holds a key to it.
  homebrew:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render from the published checksums
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          packaging/brew/generate.sh "$tag" homebrew
          echo "tag=$tag" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew
          path: homebrew
          if-no-files-found: error

  publish-tap:
    needs: homebrew
    uses: NakliTechie/homebrew-tap/.github/workflows/publish.yml@main
    with:
      artifact: homebrew
      message: "ferrule ${{ github.event.inputs.tag || github.ref_name }}"
    secrets:
      deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
