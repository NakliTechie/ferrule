name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: make check
      # The binary must cross-compile with no cgo on every shipped target, or the
      # single-binary promise is not one.
      - run: make dist
